<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activer votre licence | MyStrow</title>
  <meta name="description" content="Activez les 12 mois de licence MyStrow livrés avec votre boîtier USB-DMX : le code en bas de la carte et le numéro de série sous le boîtier.">
  <!-- Indexable, volontairement : la carte peut se perdre et le QR peut ne pas
       se scanner. Un client doit pouvoir retomber ici depuis un moteur de
       recherche, pas seulement depuis le carton. -->
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://mystrow.fr/activate">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080807; --bg2: #0e0d09; --bg3: #141310;
      --accent: #E2CE16; --accent-glow: rgba(226,206,22,0.12);
      --accent-border: rgba(226,206,22,0.22);
      --text: #f4f1e8; --muted: #7a7570;
      --card: rgba(255,255,255,0.03); --border: rgba(226,206,22,0.14);
      --green: #22c55e; --red: #ef4444;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; line-height: 1.6; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; }

    /* NAV */
    header { position: sticky; top: 0; z-index: 100; background: rgba(6,6,5,0.92); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
    nav { display: flex; align-items: center; height: 68px; padding: 0 40px; max-width: 1280px; margin: 0 auto; }
    .nav-logo { display: flex; align-items: center; text-decoration: none; font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--text); letter-spacing: 1px; }
    .nav-logo em { color: var(--accent); font-style: normal; }
    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
    .user-email { font-size: 12px; color: var(--muted); display: none; }
    .btn-logout { background: transparent; border: 1px solid rgba(255,255,255,0.12); color: var(--muted); padding: 8px 18px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: border-color 0.2s, color 0.2s; display: none; }
    .btn-logout:hover { border-color: var(--accent); color: var(--accent); }

    /* LAYOUT */
    main { flex: 1; padding: 60px 28px 80px; max-width: 860px; margin: 0 auto; width: 100%; }

    /* LOGIN */
    .login-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; }
    .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 48px 44px; width: 100%; max-width: 440px; }
    .login-title { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 1px; margin-bottom: 6px; }
    .login-title em { font-style: normal; color: var(--accent); }
    .login-sub { font-size: 13px; color: var(--muted); margin-bottom: 36px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .form-group label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.8px; text-transform: uppercase; font-family: 'Barlow Condensed', sans-serif; }
    .form-group input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px 16px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; outline: none; transition: border-color 0.18s; width: 100%; }
    .form-group input:focus { border-color: var(--accent); }
    .form-group input::placeholder { color: var(--muted); }
    .btn-full { width: 100%; background: var(--accent); color: #0c0b00; border: none; padding: 13px 24px; border-radius: 999px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; transition: opacity 0.2s; margin-top: 4px; }
    .btn-full:hover { opacity: 0.88; }
    .btn-full:disabled { opacity: 0.4; cursor: not-allowed; }
    .login-error { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); border-radius: 8px; padding: 11px 14px; font-size: 13px; color: #f87171; margin-top: 12px; display: none; }
    .forgot-link { text-align: center; margin-top: 18px; font-size: 12px; color: var(--muted); }
    .forgot-link a { color: var(--accent); text-decoration: none; cursor: pointer; }
    .forgot-link a:hover { text-decoration: underline; }
    .reset-ok { text-align: center; font-size: 13px; color: var(--green); margin-top: 10px; display: none; }

    /* ACCOUNT */
    .account-wrap { display: none; }
    .page-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(38px, 5vw, 60px); line-height: 1; letter-spacing: 1px; margin-bottom: 8px; }
    .page-title em { font-style: normal; color: var(--accent); }
    .page-sub { font-size: 14px; color: var(--muted); margin-bottom: 48px; }
    .section-tag { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }

    /* CARDS */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 32px; margin-bottom: 20px; }
    .card-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; margin-bottom: 20px; letter-spacing: 0.3px; }
    .card-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .card-row:last-child { border-bottom: none; padding-bottom: 0; }
    .card-row:first-of-type { padding-top: 0; }
    .row-label { font-size: 12px; color: var(--muted); font-weight: 500; }
    .row-value { font-size: 14px; font-weight: 600; text-align: right; }

    /* BADGE */
    .badge { display: inline-block; padding: 3px 12px; border-radius: 999px; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .badge-active { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: var(--green); }
    .badge-expired { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); color: #f87171; }
    .badge-trial { background: rgba(226,206,22,0.1); border: 1px solid var(--accent-border); color: var(--accent); }
    .badge-monthly { background: rgba(99,91,255,0.1); border: 1px solid rgba(99,91,255,0.3); color: #a5b4fc; }
    .badge-annual { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); color: var(--green); }
    .badge-lifetime { background: rgba(226,206,22,0.1); border: 1px solid var(--accent-border); color: var(--accent); }

    /* MACHINES */
    .machine-item { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .machine-item:last-child { border-bottom: none; padding-bottom: 0; }
    .machine-item:first-child { padding-top: 0; }
    .machine-info { display: flex; flex-direction: column; gap: 3px; }
    .machine-name { font-size: 14px; font-weight: 600; }
    .machine-date { font-size: 12px; color: var(--muted); }
    .machine-icon { font-size: 22px; margin-right: 12px; flex-shrink: 0; }
    .machine-left { display: flex; align-items: center; }
    .btn-revoke { background: transparent; border: 1px solid rgba(239,68,68,0.3); color: #f87171; padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: background 0.2s, border-color 0.2s; white-space: nowrap; }
    .btn-revoke:hover { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.6); }
    .btn-revoke:disabled { opacity: 0.4; cursor: not-allowed; }
    .no-machines { font-size: 13px; color: var(--muted); padding: 8px 0; }

    /* BILLING BUTTONS */
    .billing-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
    .btn-portal { background: var(--accent); color: #0c0b00; border: none; padding: 13px 28px; border-radius: 999px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; transition: opacity 0.2s; text-align: center; }
    .btn-portal:hover { opacity: 0.88; }
    .btn-portal:disabled { opacity: 0.4; cursor: not-allowed; }
    .billing-note { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 4px; }
    .upgrade-hint { background: var(--accent-glow); border: 1px solid var(--accent-border); border-radius: 10px; padding: 14px 18px; margin-bottom: 16px; font-size: 13px; line-height: 1.6; display: none; }
    .upgrade-hint strong { color: var(--accent); }

    /* INVOICES */
    .invoice-item { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .invoice-item:last-child { border-bottom: none; padding-bottom: 0; }
    .invoice-item:first-child { padding-top: 0; }
    .invoice-meta { display: flex; flex-direction: column; gap: 3px; }
    .invoice-amount { font-size: 14px; font-weight: 600; }
    .invoice-date { font-size: 12px; color: var(--muted); }
    .btn-invoice { background: transparent; border: 1px solid rgba(226,206,22,0.3); color: var(--accent); padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; text-decoration: none; white-space: nowrap; transition: background 0.2s, border-color 0.2s; display: inline-block; }
    .btn-invoice:hover { background: rgba(226,206,22,0.08); border-color: rgba(226,206,22,0.6); }
    .no-invoices { font-size: 13px; color: var(--muted); padding: 8px 0; }

    /* LOADING */
    .loading-wrap { display: flex; align-items: center; justify-content: center; min-height: 60vh; }
    .spinner { width: 32px; height: 32px; border: 3px solid rgba(226,206,22,0.15); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* FOOTER */


    @media (max-width: 600px) {
      nav { padding: 0 20px; }
      .login-card { padding: 36px 24px; }
      main { padding: 40px 20px 60px; }
      .card { padding: 22px 20px; }
    }
  
    /* Lang dropdown */
    .lang-selector { position: relative; display: inline-flex; }
    .lang-selector-btn {
      display: flex; align-items: center; gap: 6px;
      background: transparent; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px; padding: 5px 10px; color: var(--muted);
      font-size: 11px; font-weight: 700; letter-spacing: 1px;
      cursor: pointer; transition: all 0.18s; white-space: nowrap;
      font-family: inherit;
    }
    .lang-selector-btn:hover,
    .lang-selector:focus-within .lang-selector-btn { border-color: var(--accent); color: var(--accent); }
    .lang-chevron { font-size:9px; opacity:.5; margin-left:2px; transition: transform .18s; display:inline-block; }
    .lang-selector:hover .lang-chevron,
    .lang-selector:focus-within .lang-chevron { transform: rotate(180deg); opacity:.8; }
    .lang-dropdown {
      display: none; position: absolute; top: calc(100% + 7px); right: 0;
      background: #141414; border: 1px solid #2a2a2a; border-radius: 8px;
      padding: 6px 0; min-width: 110px; z-index: 999;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
    .lang-selector:hover .lang-dropdown,
    .lang-selector:focus-within .lang-dropdown { display: block; }
    .lang-dropdown a, .lang-dropdown span {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 14px; font-size: 12px; font-weight: 600;
      color: var(--muted); text-decoration: none; letter-spacing: 1px;
      transition: color .15s, background .15s; white-space: nowrap;
    }
    .lang-dropdown a:hover { color: var(--accent); background: rgba(255,215,0,.05); }
    .lang-dropdown span { color: var(--accent); cursor: default; }

    /* Footer newsletter */
        
    @media (max-width: 700px) {
      .nl-strip { flex-direction: column; align-items: flex-start; padding: 36px 20px; }
      .nl-form input[type="email"] { width: 160px; }
    }
    /* ── Footer ─────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 32px 32px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .footer-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }
    .footer-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: var(--text);
      text-decoration: none;
      letter-spacing: 1px;
      flex-shrink: 0;
    }
    .footer-logo em { font-style: normal; color: var(--accent); }
    .footer-links {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .footer-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: var(--text); }
    .footer-nl { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .nl-form {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      transition: border-color .2s;
    }
    .nl-form:focus-within { border-color: var(--accent); }
    .nl-form input[type="email"] {
      background: #111;
      border: none;
      padding: 10px 16px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      width: 200px;
    }
    .nl-form input[type="email"]::placeholder { color: #555; }
    .nl-form button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 18px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: .5px;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      transition: background .18s;
    }
    .nl-form button:hover { background: #ffd700; }
    .nl-msg { font-size: 11px; min-height: 14px; }
    .nl-msg.ok  { color: var(--accent); }
    .nl-msg.err { color: #ff5555; }
    .footer-copy {
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
    @media (max-width: 780px) {
      .footer-main { flex-direction: column; align-items: flex-start; gap: 20px; }
      .footer-nl { align-items: flex-start; }
      .nl-form input[type="email"] { width: 150px; }
    }
    
    /* ── ACTIVATION ─────────────────────────────────────── */
    .act-wrap { max-width: 620px; margin: 0 auto; }
    .act-card { max-width: none; padding: 36px 34px; }
    .form-group label .hint { color: #5f5b56; font-weight: 500; letter-spacing: 0.4px; text-transform: none; font-family: 'Inter', sans-serif; font-size: 11px; }
    input.mono { font-family: 'Barlow Condensed', ui-monospace, monospace; font-size: 22px !important; font-weight: 700; letter-spacing: 3px; text-align: center; padding: 14px 12px !important; }
    input.mono::placeholder { letter-spacing: 3px; font-weight: 600; opacity: 0.45; }
    input.bad { border-color: rgba(239,68,68,0.55) !important; }
    .field-err { font-size: 12px; color: #f87171; min-height: 0; display: none; }
    .field-err.on { display: block; }
    .legal { font-size: 11px; color: var(--muted); text-align: center; margin-top: 16px; line-height: 1.5; }
    .legal a { color: var(--muted); text-decoration: underline; }
    .legal a:hover { color: var(--accent); }

    /* Où trouver quoi */
    .where { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; }
    .where-box { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 18px 18px 16px; }
    .where-box h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 0.4px; margin-bottom: 7px; color: var(--text); }
    .where-box p { font-size: 12.5px; color: var(--muted); line-height: 1.65; }
    .where-box .sample { display: inline-block; margin-top: 9px; font-family: 'Barlow Condensed', monospace; font-size: 14px; font-weight: 700; letter-spacing: 2px; color: var(--accent); background: var(--accent-glow); border: 1px solid var(--accent-border); border-radius: 6px; padding: 3px 10px; }

    /* Confirmation de l'adresse */
    .confirm-box { text-align: center; }
    .confirm-box .big-email { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(20px, 5vw, 28px); font-weight: 800; color: var(--accent); word-break: break-all; margin: 18px 0 6px; letter-spacing: 0.5px; }
    .confirm-note { font-size: 13px; color: var(--muted); line-height: 1.65; margin-bottom: 26px; }
    .btn-ghost { width: 100%; background: transparent; border: 1px solid rgba(255,255,255,0.14); color: var(--muted); padding: 12px 24px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; margin-top: 10px; transition: border-color 0.2s, color 0.2s; }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .recap { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
    .recap-row { display: flex; justify-content: space-between; gap: 14px; font-size: 12.5px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .recap-row span:first-child { color: var(--muted); }
    .recap-row span:last-child { font-family: 'Barlow Condensed', monospace; font-weight: 700; letter-spacing: 1.5px; }

    /* Succès */
    .done-mark { width: 62px; height: 62px; border-radius: 50%; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.35); color: var(--green); display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 22px; }
    .done-title { font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 1px; text-align: center; margin-bottom: 6px; }
    .done-sub { font-size: 14px; color: var(--muted); text-align: center; line-height: 1.7; margin-bottom: 26px; }
    .done-sub strong { color: var(--text); }
    .mail-note { background: var(--accent-glow); border: 1px solid var(--accent-border); border-radius: 10px; padding: 14px 18px; font-size: 12.5px; line-height: 1.65; color: var(--muted); margin-bottom: 24px; }
    .mail-note strong { color: var(--accent); }
    .done-actions { display: flex; flex-direction: column; gap: 10px; }
    .btn-second { display: block; text-align: center; text-decoration: none; border: 1px solid rgba(226,206,22,0.3); color: var(--accent); padding: 12px 24px; border-radius: 999px; font-size: 13px; font-weight: 700; transition: background 0.2s; }
    .btn-second:hover { background: rgba(226,206,22,0.08); }
    .btn-full[disabled] .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(0,0,0,0.25); border-top-color: #0c0b00; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px; margin-right: 7px; }

    /* Bascule de langue */
    .lang-switch { text-align: right; margin-bottom: 18px; font-size: 11px; letter-spacing: 1.5px; font-weight: 700; font-family: 'Barlow Condensed', sans-serif; }
    .lang-switch button { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px 7px; font: inherit; letter-spacing: inherit; }
    .lang-switch button.on { color: var(--accent); }
    .lang-switch button:hover { color: var(--accent); }

    @media (max-width: 560px) {
      .where { grid-template-columns: 1fr; }
      .act-card { padding: 28px 20px; }
      input.mono { font-size: 19px !important; letter-spacing: 2px; }
    }
</style>

<body>

<header>
  <nav>
    <a href="./" class="nav-logo">MY<em>STROW</em></a>
  </nav>
</header>

<main>
  <div class="act-wrap">

    <div class="lang-switch" id="lang-switch"></div>

    <!-- ÉTAPE 1 — saisie -->
    <section id="view-form">
      <div class="section-tag" data-t="tag"></div>
      <h1 class="page-title" data-t="title"></h1>
      <p class="page-sub" data-t="sub"></p>

      <div class="login-card act-card">
        <div class="form-group">
          <label for="f-code" data-t="l_code"></label>
          <input id="f-code" class="mono" placeholder="XXXX-XXXX-XXXX" maxlength="14"
                 autocomplete="off" autocapitalize="characters" spellcheck="false">
          <div class="field-err" id="err-code"></div>
        </div>

        <div class="form-group">
          <label for="f-serial" data-t="l_serial"></label>
          <input id="f-serial" class="mono" placeholder="MS-DMX-0000-XXXX" maxlength="16"
                 autocomplete="off" autocapitalize="characters" spellcheck="false">
          <div class="field-err" id="err-serial"></div>
        </div>

        <div class="form-group">
          <label for="f-email" data-t="l_email"></label>
          <input id="f-email" type="email" placeholder="vous@exemple.fr" autocomplete="email">
          <div class="field-err" id="err-email"></div>
        </div>

    d_mail_old: (m) => `A sua conta <strong>${m}</strong> já existia: inicie sessão com a palavra-passe habitual.`
  }
};

const ORDER = ['fr', 'en', 'de', 'es', 'pt'];

// Langue d'arrivee : ?lang= s'il est passe, sinon celle du navigateur, sinon
// le francais. Un client allemand qui scanne le QR d'une carte bilingue doit
// quand meme tomber sur une page qu'il lit.
const _q = new URLSearchParams(location.search).get('lang');
let LANG = ORDER.includes((_q || '').toLowerCase())
  ? _q.toLowerCase()
  : (ORDER.includes((navigator.language || 'fr').slice(0, 2).toLowerCase())
      ? (navigator.language || 'fr').slice(0, 2).toLowerCase()
      : 'fr');

function t() { return T[LANG]; }

document.getElementById('lang-switch').innerHTML = ORDER.map(
  l => `<button id="lang-${l}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`
).join('');

function setLang(l) {
  LANG = ORDER.includes(l) ? l : 'fr';
  document.documentElement.lang = LANG;
  document.title = t().doc_title;
  ORDER.forEach(x => {
    document.getElementById('lang-' + x).className = (x === LANG) ? 'on' : '';
  });
  document.querySelectorAll('[data-t]').forEach(el => {
    const v = t()[el.dataset.t];
    if (v !== undefined) el.innerHTML = v;
  });
  document.getElementById('f-email').placeholder = t().mail_ph;
  // Le telechargement a sa page par langue ; le compte client n'existe qu'en
  // francais, son lien reste donc le meme partout.
  document.getElementById('lnk-dl').href = t().dl_href;
  // Les messages d'erreur déjà affichés sont figés dans l'ancienne langue :
  // on les efface plutôt que de laisser une page moitié FR moitié EN.
  ['code', 'serial', 'email'].forEach(clearErr);
  const fe = document.getElementById('form-error');
  if (fe) fe.style.display = 'none';
}

// ── Code : mêmes règles que le générateur et la Cloud Function ─────────────
function normCode(raw) {
  const up = (raw || '').toUpperCase().replace(/O/g, '0');   // le O n'existe pas
  return [...up].filter(c => ALPHABET.includes(c)).join('');
}
function checkChar(body) {
  let total = 0;
  for (let i = 0; i < body.length; i++) total += (i + 1) * ALPHABET.indexOf(body[i]);
  return ALPHABET[total % ALPHABET.length];
}
// Le caractère de contrôle attrape une faute de frappe isolée et l'inversion
// de deux caractères voisins : on le dit ici, sans aller-retour serveur.
function codeOk(c) {
  return c.length === BODY_LEN + 1 && c[c.length - 1] === checkChar(c.slice(0, -1));
}
function prettyCode(c) { return (c.match(/.{1,4}/g) || []).join('-'); }

// ── Numéro de série : MS-DMX-0001-B9ER, saisi comme on veut ────────────────
function normSerial(raw) {
  let up = (raw || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
  if (up.startsWith('MSDMX')) up = up.slice(5);
  if (!/^\d{4}[0-9A-Z]{4}$/.test(up)) return '';
  return 'MS-DMX-' + up.slice(0, 4) + '-' + up.slice(4);
}

function emailOk(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e); }

// ── Saisie assistée ────────────────────────────────────────────────────────
const fCode   = document.getElementById('f-code');
const fSerial = document.getElementById('f-serial');
const fEmail  = document.getElementById('f-email');

fCode.addEventListener('input', () => {
  const raw = normCode(fCode.value).slice(0, BODY_LEN + 1);
  fCode.value = prettyCode(raw);
  clearErr('code');
});
fSerial.addEventListener('input', () => {
  // On formate seulement quand c'est complet : sinon le tiret ajouté d'office
  // se bat avec le curseur pendant la frappe.
  const s = normSerial(fSerial.value);
  if (s) fSerial.value = s;
  else fSerial.value = fSerial.value.toUpperCase();
  clearErr('serial');
});
fEmail.addEventListener('input', () => clearErr('email'));
[fCode, fSerial, fEmail].forEach(el => el.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); goConfirm(); }
}));

function setErr(field, msg) {
  const box = document.getElementById('err-' + field);
  box.textContent = msg;
  box.classList.add('on');
  document.getElementById('f-' + field).classList.add('bad');
}
function clearErr(field) {
  document.getElementById('err-' + field).classList.remove('on');
  document.getElementById('f-' + field).classList.remove('bad');
}

function show(id) {
  ['view-form', 'view-confirm', 'view-done'].forEach(v => {
    document.getElementById(v).hidden = (v !== id);
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Étape 1 → 2 ────────────────────────────────────────────────────────────
let PAYLOAD = null;

function goConfirm() {
  const code   = normCode(fCode.value);
  const serial = normSerial(fSerial.value);
  const email  = fEmail.value.trim().toLowerCase();
  let ok = true;

  if (!codeOk(code))     { setErr('code',   t().e_code);   ok = false; }
  if (!serial)           { setErr('serial', t().e_serial); ok = false; }
  if (!emailOk(email))   { setErr('email',  t().e_email);  ok = false; }
  if (!ok) return;

  PAYLOAD = { code, serial, email };
  document.getElementById('r-code').textContent   = prettyCode(code);
  document.getElementById('r-serial').textContent = serial;
  document.getElementById('r-email').textContent  = email;
  document.getElementById('form-error').style.display = 'none';
  show('view-confirm');
}

// ── Étape 2 → 3 ────────────────────────────────────────────────────────────
async function activate() {
  const btn = document.getElementById('btn-activate');
  const err = document.getElementById('form-error');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>' + t().working;
  err.style.display = 'none';

  try {
    const r = await fetch(CF_ACTIVATE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...PAYLOAD, lang: LANG })
    });
    const d = await r.json().catch(() => ({}));

    if (!r.ok || !d.ok) {
      err.textContent = d.message || t().e_net;
      err.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = t().btn_go;
      return;
    }

    document.getElementById('done-sub').innerHTML =
      (d.is_new ? t().d_sub_new : t().d_sub_old)(d.expiry_label);
    document.getElementById('done-mail').innerHTML =
      (d.is_new ? t().d_mail_new : t().d_mail_old)(d.email);
    show('view-done');
    if (typeof gtag === 'function') gtag('event', 'activation_boitier');

  } catch (e) {
    err.textContent = t().e_net;
    err.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = t().btn_go;
  }
}

document.getElementById('btn-next').onclick     = goConfirm;
document.getElementById('btn-activate').onclick = activate;
document.getElementById('btn-back').onclick     = () => show('view-form');

setLang(LANG);
</script>
<script>
function handleNewsletter(e) {
  e.preventDefault();
  var email = document.getElementById('nl-email').value;
  if (!email) return;
  var btn = e.target.querySelector('button');
  var msg = document.getElementById('nl-msg');
  btn.disabled = true;
  btn.style.opacity = '0.6';
  fetch('https://us-central1-mystrow-907be.cloudfunctions.net/subscribe_newsletter', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, lang: (document.documentElement.lang || 'fr').slice(0, 2) })
  }).then(function(r) {
    if (r.ok || r.status === 204) { msg.textContent = '✓ Bienvenue !'; msg.className = 'nl-msg ok'; }
    else { msg.textContent = 'Une erreur est survenue.'; msg.className = 'nl-msg err'; btn.disabled = false; btn.style.opacity = ''; }
  }).catch(function() { msg.textContent = 'Une erreur est survenue.'; msg.className = 'nl-msg err'; btn.disabled = false; btn.style.opacity = ''; });
}
</script>
