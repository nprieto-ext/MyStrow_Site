  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080807; --bg2: #0e0d09; --bg3: #141310;
      --accent: #E2CE16; --accent-glow: rgba(226,206,22,0.12);
      --accent-border: rgba(226,206,22,0.22);
      --text: #f4f1e8; --muted: #7a7570;
      --card: rgba(255,255,255,0.03); --border: rgba(226,206,22,0.14);
      --green: #22c55e;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; line-height: 1.6; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; }

    header { position: sticky; top: 0; z-index: 100; background: rgba(6,6,5,0.92); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
    nav { display: flex; align-items: center; height: 68px; padding: 0 40px; max-width: 1280px; margin: 0 auto; }
    .nav-logo { display: flex; align-items: center; text-decoration: none; font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--text); letter-spacing: 1px; }
    .nav-logo em { color: var(--accent); font-style: normal; }

    main { flex: 1; padding: 48px 28px 80px; max-width: 760px; margin: 0 auto; width: 100%; }

    .lang-switch { text-align: right; margin-bottom: 18px; font-size: 11px; letter-spacing: 1.5px; font-weight: 700; font-family: 'Barlow Condensed', sans-serif; }
    .lang-switch button { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px 7px; font: inherit; letter-spacing: inherit; }
    .lang-switch button.on, .lang-switch button:hover { color: var(--accent); }

    .section-tag { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
    .page-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(40px, 6vw, 64px); line-height: 1; letter-spacing: 1px; margin-bottom: 12px; }
    .page-title em { font-style: normal; color: var(--accent); }
    .page-sub { font-size: 15px; color: var(--muted); margin-bottom: 40px; max-width: 600px; }

    /* Étapes */
    .steps { display: flex; flex-direction: column; gap: 16px; margin-bottom: 48px; }
    .step { display: grid; grid-template-columns: 52px 1fr; gap: 18px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 26px 28px; }
    .step-num { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #0c0b00; font-family: 'Bebas Neue', sans-serif; font-size: 26px; display: flex; align-items: center; justify-content: center; }
    .step h2 { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 0.3px; margin-bottom: 6px; line-height: 1.2; }
    .step p { font-size: 14px; color: var(--muted); line-height: 1.7; }
    .step p strong { color: var(--text); font-weight: 600; }
    .step-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .btn { display: inline-block; text-decoration: none; padding: 11px 22px; border-radius: 999px; font-size: 13px; font-weight: 700; transition: opacity 0.2s, background 0.2s; }
    .btn-main { background: var(--accent); color: #0c0b00; }
    .btn-main:hover { opacity: 0.88; }
    .btn-alt { border: 1px solid rgba(226,206,22,0.3); color: var(--accent); }
    .btn-alt:hover { background: rgba(226,206,22,0.08); }
    .note { margin-top: 14px; background: var(--accent-glow); border: 1px solid var(--accent-border); border-radius: 10px; padding: 12px 16px; font-size: 13px; line-height: 1.65; color: var(--muted); }
    .note strong { color: var(--accent); }

    /* Cas particuliers */
    .faq-title { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 1px; margin-bottom: 16px; }
    .faq { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .faq-box { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 18px 20px; }
    .faq-box h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 800; letter-spacing: 0.3px; margin-bottom: 7px; }
    .faq-box p { font-size: 13px; color: var(--muted); line-height: 1.65; }
    .faq-box a { color: var(--accent); }
    .faq-box p strong { color: var(--text); font-weight: 600; }

    .thanks { text-align: center; margin-top: 48px; font-size: 14px; color: var(--muted); }
    .thanks strong { color: var(--text); }
    .thanks a { color: var(--accent); }

    @media (max-width: 600px) {
      nav { padding: 0 20px; }
      main { padding: 32px 16px 60px; }
      .step { grid-template-columns: 1fr; gap: 12px; padding: 22px 20px; }
      .faq { grid-template-columns: 1fr; }
    }

    /* ── Footer ─────────────────────────────────────────── */
    footer { border-top: 1px solid var(--border); padding: 32px 32px 20px; display: flex; flex-direction: column; gap: 20px; }
    .footer-main { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
    .footer-logo { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--text); text-decoration: none; letter-spacing: 1px; flex-shrink: 0; }
    .footer-logo em { font-style: normal; color: var(--accent); }
    .footer-links { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
    .footer-links a { color: var(--muted); text-decoration: none; font-size: 13px; transition: color 0.2s; }
    .footer-links a:hover { color: var(--text); }
    .footer-nl { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .nl-form { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; transition: border-color .2s; }
    .nl-form:focus-within { border-color: var(--accent); }
    .nl-form input[type="email"] { background: #111; border: none; padding: 10px 16px; color: var(--text); font-size: 13px; outline: none; width: 200px; }
    .nl-form input[type="email"]::placeholder { color: #555; }
    .nl-form button { background: var(--accent); color: #000; border: none; padding: 10px 18px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: .5px; text-transform: uppercase; cursor: pointer; white-space: nowrap; transition: background .18s; }
    .nl-form button:hover { background: #ffd700; }
    .nl-msg { font-size: 11px; min-height: 14px; }
    .nl-msg.ok  { color: var(--accent); }
    .nl-msg.err { color: #ff5555; }
    .footer-copy { color: var(--muted); font-size: 11px; text-align: center; border-top: 1px solid var(--border); padding-top: 16px; }
    @media (max-width: 780px) {
      .footer-main { flex-direction: column; align-items: flex-start; gap: 20px; }
      .footer-nl { align-items: flex-start; }
      .nl-form input[type="email"] { width: 150px; }
    }

<script>

const LINKS = (l) => ({

});

const ORDER = ['fr', 'en', 'de', 'es', 'pt'];

// ?lang= d'abord, puis la langue du navigateur, sinon le français.
const _q = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
const _nav = (navigator.language || 'fr').slice(0, 2).toLowerCase();
let LANG = ORDER.includes(_q) ? _q : (ORDER.includes(_nav) ? _nav : 'fr');

document.getElementById('lang-switch').innerHTML = ORDER.map(
  l => `<button id="lang-${l}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`
).join('');

function setLang(l) {
  LANG = ORDER.includes(l) ? l : 'fr';
  const t = T[LANG], k = LINKS(LANG);
  document.documentElement.lang = LANG;
  document.title = t.doc_title;
  ORDER.forEach(x => {
    document.getElementById('lang-' + x).className = (x === LANG) ? 'on' : '';
  });
  document.querySelectorAll('[data-t]').forEach(el => {
    const v = t[el.dataset.t];
    if (v !== undefined) el.innerHTML = v.replace(/\{(dl|shop|contact)\}/g, (_, n) => k[n]);
  });
  document.getElementById('lnk-dl').href = k.dl;
}

setLang(LANG);
</script>
<script>
function handleNewsletter(e) {
  e.preventDefault();
  var email = document.getElementById('nl-email').value;
  if (!email) return;
  var btn = e.target.querySelector('button');
  var msg = document.getElementById('nl-msg');
  btn.disabled = true;
  btn.style.opacity = '0.6';
  fetch('https://us-central1-mystrow-907be.cloudfunctions.net/subscribe_newsletter', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, lang: (document.documentElement.lang || 'fr').slice(0, 2) })
  }).then(function(r) {
    if (r.ok || r.status === 204) { msg.textContent = '✓ Bienvenue !'; msg.className = 'nl-msg ok'; }
    else { msg.textContent = 'Une erreur est survenue.'; msg.className = 'nl-msg err'; btn.disabled = false; btn.style.opacity = ''; }
  }).catch(function() { msg.textContent = 'Une erreur est survenue.'; msg.className = 'nl-msg err'; btn.disabled = false; btn.style.opacity = ''; });
}
</script>
